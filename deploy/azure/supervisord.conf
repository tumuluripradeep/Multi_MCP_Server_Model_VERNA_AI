[supervisord]
nodaemon=true
user=root

; Single Python orchestrator — must be main.py (starts Streamlit + chrome client + Slack, etc.)
[program:verna]
command=/usr/local/bin/python /app/main.py
directory=/app
environment=STREAMLIT_SERVER_ADDRESS="0.0.0.0",PYTHONUNBUFFERED="1",VERNA_CLIENT_READY_SEC="12"
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
priority=10
startretries=3

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=20
startsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
